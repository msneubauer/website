<style>
/* Pull the entire cta-button-list block upward */
.blox-cta-button-list {
  margin-top: -7rem !important;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // Find all anchor tags and buttons inside cta-button-list blocks
  const ctaElements = document.querySelectorAll('.blox-cta-button-list a, .blox-cta-button-list button');

  ctaElements.forEach(el => {
    // Only modify internal links (relative URLs)
    if (el.href && el.href.startsWith(window.location.origin + '/')) {
      el.setAttribute('target', '_self');
      el.removeAttribute('rel');
    }
  });
});
</script>
